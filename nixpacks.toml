[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput --settings=expensetracker.settings_production"]

[start]
cmd = "gunicorn expensetracker.wsgi:application --settings=expensetracker.settings_production"